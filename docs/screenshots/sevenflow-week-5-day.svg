    <g transform="translate(92 674)" class="ui">
      <rect width="1100" height="126" rx="22" fill="#101b30" stroke="#334155"/>
      <g transform="translate(22 20)">
        <text font-size="15" font-weight="800" fill="#eaf2ff">This week</text>
        <rect y="24" width="320" height="46" rx="13" fill="#16233b" stroke="#334155"/>
        <text x="18" y="54" font-size="15" fill="#cbd5e1">Prepare release notes</text>
      </g>
      <g transform="translate(390 20)">
        <text font-size="15" font-weight="800" fill="#eaf2ff">Next week</text>
        <rect y="24" width="320" height="46" rx="13" fill="#16233b" stroke="#334155"/>
        <text x="18" y="54" font-size="15" fill="#cbd5e1">Review plugin idea</text>
      </g>
      <g transform="translate(758 20)">
        <text font-size="15" font-weight="800" fill="#eaf2ff">Later</text>
        <rect y="24" width="320" height="46" rx="13" fill="#16233b" stroke="#334155"/>
        <text x="18" y="54" font-size="15" fill="#cbd5e1">Clean backlog</text>
      </g>
