      </g>
      <g transform="translate(448 0)">
        <rect width="204" height="390" rx="22" fill="#101b30" stroke="#334155"/>
        <rect width="204" height="78" rx="22" fill="#1d283d"/>
        <path d="M0 56h204v34H0z" fill="#1d283d"/>
        <text x="102" y="32" text-anchor="middle" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing=".12em">SATURDAY</text>
        <text x="102" y="63" text-anchor="middle" font-size="30" font-weight="900" fill="#eaf2ff">14</text>
        <rect class="task" x="16" y="104" width="172" height="58" rx="15"/>
        <text x="34" y="139" font-size="16" fill="#e2e8f0">Buy groceries</text>
        <rect class="task" x="16" y="176" width="172" height="58" rx="15"/>
        <text x="34" y="210" font-size="16" fill="#e2e8f0">Clean kitchen</text>
      </g>
      <g transform="translate(672 0)">
        <rect width="204" height="390" rx="22" fill="#101b30" stroke="#334155"/>
        <rect width="204" height="78" rx="22" fill="#1d283d"/>
        <path d="M0 56h204v34H0z" fill="#1d283d"/>
        <text x="102" y="32" text-anchor="middle" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing=".12em">SUNDAY</text>
        <text x="102" y="63" text-anchor="middle" font-size="30" font-weight="900" fill="#eaf2ff">15</text>
        <rect class="task" x="16" y="104" width="172" height="58" rx="15"/>
        <text x="34" y="139" font-size="16" fill="#e2e8f0">Family time</text>
      </g>
      <g transform="translate(896 0)">
        <rect width="204" height="390" rx="22" fill="#101b30" stroke="#334155"/>
        <rect width="204" height="78" rx="22" fill="#1d283d"/>
        <path d="M0 56h204v34H0z" fill="#1d283d"/>
        <text x="102" y="32" text-anchor="middle" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing=".12em">MONDAY</text>
        <text x="102" y="63" text-anchor="middle" font-size="30" font-weight="900" fill="#eaf2ff">16</text>
