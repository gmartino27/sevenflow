        <rect width="204" height="78" rx="22" fill="#1e3a8a"/>
        <path d="M0 56h204v34H0z" fill="#1e3a8a"/>
        <text x="102" y="32" text-anchor="middle" font-size="13" font-weight="800" fill="#cbd5e1" letter-spacing=".12em">THURSDAY</text>
        <text x="102" y="63" text-anchor="middle" font-size="30" font-weight="900" fill="#ffffff">12</text>
        <rect class="taskHot" x="16" y="104" width="172" height="58" rx="15"/>
        <text x="34" y="139" font-size="17" font-weight="700" fill="#ffffff">Plan product work</text>
        <rect class="task" x="16" y="176" width="172" height="58" rx="15"/>
        <text x="34" y="210" font-size="16" fill="#e2e8f0">Vitamins</text>
        <circle cx="166" cy="204" r="7" fill="#3b82f6"/>
        <rect class="task" x="16" y="248" width="172" height="58" rx="15"/>
        <text x="34" y="282" font-size="16" fill="#e2e8f0">Send invoice</text>
