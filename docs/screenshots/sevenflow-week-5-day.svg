        <rect width="204" height="78" rx="22" fill="#1d283d"/>
        <path d="M0 56h204v34H0z" fill="#1d283d"/>
        <text x="102" y="32" text-anchor="middle" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing=".12em">FRIDAY</text>
        <text x="102" y="63" text-anchor="middle" font-size="30" font-weight="900" fill="#eaf2ff">13</text>
        <rect class="task" x="16" y="104" width="172" height="58" rx="15"/>
        <text x="34" y="139" font-size="16" fill="#e2e8f0">School pickup</text>
        <rect class="task" x="16" y="176" width="172" height="58" rx="15"/>
        <text x="34" y="210" font-size="16" fill="#e2e8f0">Weekly review</text>
        <rect x="16" y="254" width="172" height="58" rx="15" fill="#0d1728" stroke="#334155" stroke-dasharray="5 6"/>
