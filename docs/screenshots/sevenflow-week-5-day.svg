    <g transform="translate(1234 252)" class="ui">
      <rect width="110" height="548" rx="28" fill="#101b30" stroke="#334155"/>
      <circle cx="55" cy="52" r="18" fill="#1d4ed8"/>
      <circle cx="55" cy="122" r="18" fill="#16233b" stroke="#334155"/>
      <circle cx="55" cy="192" r="18" fill="#16233b" stroke="#334155"/>
      <circle cx="55" cy="262" r="18" fill="#16233b" stroke="#334155"/>
      <circle cx="55" cy="332" r="18" fill="#16233b" stroke="#334155"/>
    </g>
