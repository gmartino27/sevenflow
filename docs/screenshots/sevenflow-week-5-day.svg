<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">SevenFlow 5 day week planning view</title>
  <desc id="desc">A dark themed SevenFlow weekly planning screen with five day columns, tasks, reminders, tags and backlog columns.</desc>
  <defs>
    <linearGradient id="appBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66d8ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.16"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
      .muted { fill: #94a3b8; }
      .text { fill: #eaf2ff; }
      .line { stroke: #334155; stroke-width: 1; }
      .task { fill: #16233b; stroke: #334155; stroke-width: 1; }
      .taskHot { fill: #1d4ed8; stroke: #60a5fa; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="900" rx="42" fill="url(#appBg)"/>
  <circle cx="1240" cy="120" r="260" fill="#1d4ed8" opacity="0.14"/>
  <circle cx="190" cy="780" r="280" fill="#0ea5e9" opacity="0.10"/>

  <g class="ui" filter="url(#shadow)">
    <rect x="54" y="54" width="1332" height="792" rx="34" fill="#0f172a" stroke="#24324a"/>

    <g transform="translate(92 90)">
      <rect x="0" y="0" width="50" height="50" rx="14" fill="url(#blue)" filter="url(#soft)"/>
      <text x="66" y="34" font-size="30" font-weight="800"><tspan fill="#eaf2ff">Seven</tspan><tspan fill="#60a5fa">Flow</tspan></text>
      <text x="66" y="60" font-size="13" fill="#94a3b8">Calm weekly planning</text>
    </g>

    <g transform="translate(980 96)" fill="none" stroke="#64748b" stroke-width="2">
      <rect x="0" y="0" width="168" height="40" rx="20" fill="#111c31" stroke="#334155"/>
      <circle cx="24" cy="20" r="7" fill="#3b82f6" stroke="none"/>
      <path d="M64 13h62M64 27h42"/>
      <rect x="188" y="0" width="104" height="40" rx="20" fill="#1d4ed8" stroke="#60a5fa"/>
      <path d="M221 20h38M240 1v38" stroke="#dbeafe"/>
    </g>

    <g transform="translate(92 176)" class="ui">
      <rect x="0" y="0" width="72" height="52" rx="14" fill="#101b30" stroke="#334155"/>
      <path d="M43 17l-12 9 12 9" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="528" y="34" text-anchor="middle" font-size="26" font-weight="800" fill="#eaf2ff">March 12 - 16, 2026</text>
      <rect x="984" y="0" width="72" height="52" rx="14" fill="#101b30" stroke="#334155"/>
      <path d="M1013 17l12 9-12 9" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
